<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feature propagation</title><meta name="description" content="How measured accelerations at a few sensors are propagated to every node of the deck graph before the network sees them.">
<style>
:root{color-scheme:dark}
.iso{
  --page:#0c0c0c;--card:#141414;--text:#a8a8a8;--strong:#e8e8e8;--muted:#717171;
  --paper:#141414;--top:#1e1e1e;--s0:#0f0f0f;--s1:#131313;--s2:#171717;--s3:#1a1a1a;
  --lit-top:#2a2a2a;--lit-shade:#202020;
  --hi:#d6d6d6;--mid:#6c6c6c;--lo:#404040;--faint:#2b2b2b;--lit:#ffffff;
  --halo:#040404;--halo-o:.9;--dot:#e6e6e6;--cap:#262626;
  --accent:#ffffff;--trace:#cfcfcf;--trace2:#8a8a8a;--screen:#0d0f0e;
  --w:.6px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
.iso[data-theme="light"]{
  color-scheme:light;
  --page:#f1f1ee;--card:#fbfbfa;--text:#55555a;--strong:#18181a;--muted:#8b8b90;
  --paper:#fbfbfa;--top:#ffffff;--s0:#d9d9d6;--s1:#e3e3e0;--s2:#ececea;--s3:#f4f4f2;
  --lit-top:#ffffff;--lit-shade:#efefec;
  --hi:#25252a;--mid:#87878c;--lo:#b2b2b6;--faint:#d3d3d5;--lit:#000000;
  --halo:#85857c;--halo-o:.3;--dot:#38383c;--cap:#e2e2df;
  --accent:#000000;--trace:#222226;--trace2:#8d8d92;--screen:#f3f4f1;
}
html,body{margin:0}
body.iso{background:var(--page);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 48px}
.iso-svg{display:block;width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--paper)}
.iso-shade,.iso-top,.iso-side{stroke-width:.35;stroke-linejoin:round}
.iso-shade[data-shade="0"]{fill:var(--s0);stroke:var(--s0)}
.iso-shade[data-shade="1"]{fill:var(--s1);stroke:var(--s1)}
.iso-shade[data-shade="2"]{fill:var(--s2);stroke:var(--s2)}
.iso-shade[data-shade="3"]{fill:var(--s3);stroke:var(--s3)}
.iso-side{fill:url(#cylG);stroke:none}
.iso-top{fill:var(--top);stroke:var(--top)}
.iso-solid[data-lit]>.iso-top{fill:var(--lit-top);stroke:var(--lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--lit-shade);stroke:var(--lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--lit)}
.iso-halo{fill:var(--halo);filter:blur(9px);opacity:var(--halo-o);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--lo);stroke-width:var(--w);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--hi)}
.iso-line[data-tone="mid"]{stroke:var(--mid)}
.iso-line[data-tone="lo"]{stroke:var(--lo)}
.iso-line[data-tone="faint"]{stroke:var(--faint)}
.iso-line[data-tone="lit"]{stroke:var(--lit)}
.iso-dots circle{fill:var(--dot);opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="lit"] circle{fill:var(--lit);opacity:1}
.iso-face-text{fill:var(--mid);font-family:var(--mono);letter-spacing:.04em}
.iso-face-text[data-tone="lo"]{fill:var(--lo)}
.iso-face-text[data-tone="hi"]{fill:var(--hi)}
.tb-edge{fill:none;stroke:var(--mid);stroke-linecap:round;stroke-linejoin:round}
.tb-body{fill:none;stroke:var(--s2);stroke-linecap:round;stroke-linejoin:round}
.tb-shine{fill:none;stroke:var(--top);stroke-linecap:round;stroke-linejoin:round}
.iso-cap{fill:var(--cap);stroke:var(--mid);stroke-width:var(--w)}
.iso-tube[data-lit] .tb-edge{stroke:var(--lit)}
.screen-bg{fill:var(--screen);stroke:var(--lo);stroke-width:var(--w)}
.trace{fill:none;stroke:var(--trace);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.trace2{fill:none;stroke:var(--trace2);stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pulse{fill:var(--lit)}
.plate{position:relative;padding:52px 22px;background:var(--card);box-shadow:0 0 0 1px var(--mid);outline:none}
.plate:focus-visible{box-shadow:0 0 0 1px var(--mid),0 0 0 3px var(--hi)}
.corner{position:absolute;color:var(--muted);font-family:var(--mono);font-size:10.5px;line-height:1.2;letter-spacing:.04em;white-space:nowrap}
.corner[data-c="fig"]{top:18px;left:20px;color:var(--text)}
.corner[data-c="title"]{top:18px;right:20px;text-transform:uppercase;letter-spacing:.1em}
.corner[data-c="hint"]{bottom:18px;left:20px;text-transform:uppercase;letter-spacing:.1em}
.corner[data-c="readout"]{bottom:18px;right:20px;color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.controls .grp{display:flex;gap:4px;align-items:center}
.controls button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--lo);padding:3px 8px;border-radius:0;cursor:pointer}
.controls button[aria-pressed="true"]{color:var(--strong);border-color:var(--hi)}
.controls input[type=range]{width:160px;accent-color:var(--hi)}
.legend{display:grid;gap:10px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.55}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px}
.key{display:flex;gap:8px;align-items:flex-start}
.key svg{width:16px;height:10px;flex:none;margin-top:5px;overflow:visible}
.key svg path{fill:none;stroke:var(--hi);stroke-width:1;stroke-linecap:round}
.key[data-m="lit"] svg path{stroke:var(--lit)}
.key[data-m="mid"] svg path{stroke:var(--mid)}
.key[data-m="lo"] svg path{stroke:var(--lo)}
.key b{color:var(--text);font-weight:500;font-family:var(--mono);font-size:12px}
.caption{color:var(--text)}
.hat{position:relative;display:inline-block}.hat::after{content:"^";position:absolute;left:.18em;top:-.62em;font-size:.85em}
.caption code,.key code{font-family:var(--mono);font-size:12px}
@media (max-width:560px){.plate{padding:46px 6px 74px;overflow:hidden}.plate .iso-svg{width:124%;margin:0 -12%}.corner[data-c="readout"]{bottom:16px;max-width:calc(100% - 40px);white-space:normal}.corner[data-c="hint"]{bottom:52px;max-width:calc(100% - 40px);white-space:normal}}
</style></head>
<body class="iso" data-theme="dark">
<div class="wrap">
<figure style="margin:0">
<div class="plate" tabindex="0" role="application" aria-label="Feature propagation on the deck: seven accelerometers, a pin at every node. Space plays the 50 iterations, arrow keys move in time, B and T pick the phase frequency.">
<span class="corner" data-c="fig">Fig 1</span><span class="corner" data-c="title">Feature propagation</span>
<svg class="iso-svg" viewBox="0 0 760 430" role="img" aria-labelledby="f1t"><title id="f1t">Bench model of the deck with seven accelerometers and a pin at every node</title>
<defs><linearGradient id="cylG" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--s1)"/><stop offset=".38" stop-color="var(--s3)"/><stop offset=".7" stop-color="var(--s2)"/><stop offset="1" stop-color="var(--s0)"/></linearGradient></defs>
<g data-layer="base"></g><g data-layer="under"></g><g data-layer="deck"></g><g data-layer="top"></g>
</svg>
<span class="corner" data-c="hint">Hover a node · space play · ← → time · B/T phase</span><span class="corner" data-c="readout" data-readout aria-live="polite">k = 0 / 50</span>
</div>
<div class="controls"><span class="grp">iterations <button data-act="play" aria-pressed="false">play 0→50</button><button data-act="step" aria-pressed="false">step</button><button data-act="reset" aria-pressed="false">k = 0</button></span><span class="grp">phase at <button data-f="B1" aria-pressed="true">B1</button><button data-f="T1" aria-pressed="false">T1</button></span><span class="grp">time <input type="range" min="0" max="199" value="0" data-time aria-label="time sample"></span></div>
<figcaption class="legend">
<div class="keys"><div class="key" data-m="hi"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>accelerometers</b> at 7 girder nodes, cabled to the DAQ box — the only measured nodes</span></div><div class="key" data-m="hi"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>pins</b> — each node's band-passed vertical acceleration at the chosen sample (1 unit per 0.3 mm/s²; the support nodes, which carry the ground input, are clipped)</span></div><div class="key" data-m="mid"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>clamp collars</b> — sensor pins stay locked to the recording at every iteration</span></div><div class="key" data-m="lo"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>faint ring</b> on a free pin — what that node really did (the full simulation), for comparison</span></div><div class="key" data-m="lit"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>selected node</b> — hover or click; its PSD is on the analyser screen</span></div><div class="key" data-m="mid"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>counter</b> on the DAQ — iteration k of 50</span></div><div class="key" data-m="mid"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>analyser</b> — the node's S(v): 400 bins, 0–38.96 Hz, ticks at FE B1, T1, B2, T2</span></div><div class="key" data-m="hi"><svg viewBox="0 0 16 10"><path d="M1 5h14"/></svg><span><b>phase needles</b> on members — coherency phase at B1 or T1; along the member = 0, reversed = π; length = |γ|</span></div></div>
<div class="caption">Only the sensor nodes of a measured deck are recorded. Feature propagation fills the rest: X starts at zero with the sensors' values clamped in; each iteration replaces every node by Â X with Â = D<sup>−1/2</sup> A D<sup>−1/2</sup> (one weight per directed edge, D the in-degree), then re-clamps the sensors; 50 iterations. It is linear, so every time sample diffuses on its own: the pins show one sample (scrub the time), and the page iterates it exactly as <code>features.feature_propagation</code> does (checked against <code>data/extract.py</code> at k = 0, 1, 2, 5, 10, 20, 50). The band-passed time series propagated to every node give the coherency of every member, γ<sub>ij</sub>(f) = P<sub>ij</sub>/√(P<sub>ii</sub>P<sub>jj</sub>); the node PSDs are computed at the sensors, propagated the same way and row-normalised. At B1 every member reads in phase. At T1 the deck twists: in this deck the centre girder moves slightly with girder 3, so over the front half the cross beams between girder 1 and the centre girder read about π while those to girder 3 stay near 0; near the hinges |γ| is small and the phase is noise. Data: the Ng = 3 deck (L = 17.8 m), 60 s at 200 Hz, 1 % damping, multi-support white-noise input; samples 10.00–10.995 s.</div>
</figcaption>
</figure>
</div>
<script>// A small isometric SVG kit for the explainer figures (no dependencies).
// Written for this repo, following the conventions of the "anatomy" skill
// (github.com/wheresryan22/anatomy, MIT): solids filled in paper colour and
// painted back to front, four side tones by facing plus a lighter top, thin
// lines, one lit accent, a framed card with title, hint and live readout.
// The same file is imported by the Node build scripts and inlined into the
// pages (build.mjs strips the `export` keywords), so the live parts are drawn
// by exactly the code that draws the static ones.

const TAU = Math.PI * 2;

function camera(az = 28, el = 30) {
  const a = (az * Math.PI) / 180, e = (el * Math.PI) / 180;
  return { ca: Math.cos(a), sa: Math.sin(a), ce: Math.cos(e), se: Math.sin(e), k: 1, ox: 0, oy: 0 };
}

// screen point of a world point [x, y, z] (z up, y away from the viewer)
function pr(C, p) {
  const f = -p[0] * C.sa + p[1] * C.ca;
  return [C.ox + C.k * (p[0] * C.ca + p[1] * C.sa), C.oy + C.k * (-p[2] * C.ce - f * C.se)];
}

// nearness to the viewer: paint in ascending order
function near(C, p) {
  return -(-p[0] * C.sa + p[1] * C.ca) * C.ce + p[2] * C.se;
}

function fit(C, pts, W, H, pad = 24) {
  C.k = 1; C.ox = 0; C.oy = 0;
  const s = pts.map((p) => pr(C, p));
  const x0 = Math.min(...s.map((q) => q[0])), x1 = Math.max(...s.map((q) => q[0]));
  const y0 = Math.min(...s.map((q) => q[1])), y1 = Math.max(...s.map((q) => q[1]));
  C.k = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
  C.ox = (W - C.k * (x1 + x0)) / 2;
  C.oy = (H - C.k * (y1 + y0)) / 2;
  return C;
}

const f2 = (v) => (Math.round(v * 100) / 100).toString();
const pt = (q) => f2(q[0]) + " " + f2(q[1]);
const poly2d = (qs, close = true) => (qs.length ? "M" + qs.map(pt).join("L") + (close ? "Z" : "") : "");

function hull(qs) {
  const p = [...qs].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

// plan shapes, counter-clockwise in (x, y)
function rrect(x, y, w, d, r = 0, steps = 4) {
  r = Math.max(0, Math.min(r, w / 2, d / 2));
  if (r === 0) return [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
  const out = [];
  const corner = (cx, cy, a0) => { for (let i = 0; i <= steps; i++) { const a = a0 + (i / steps) * (Math.PI / 2); out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  corner(x + w - r, y + r, -Math.PI / 2); corner(x + w - r, y + d - r, 0); corner(x + r, y + d - r, Math.PI / 2); corner(x + r, y + r, Math.PI);
  return out;
}
function circ(cx, cy, r, n = 32) {
  return Array.from({ length: n }, (_, i) => [cx + r * Math.cos((i / n) * TAU), cy + r * Math.sin((i / n) * TAU)]);
}
// a bar of width w from plan point a to b (both ends square)
function bar(a, b, w) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const nx = (-dy / L) * (w / 2), ny = (dx / L) * (w / 2);
  const q = [[a[0] - nx, a[1] - ny], [b[0] - nx, b[1] - ny], [b[0] + nx, b[1] + ny], [a[0] + nx, a[1] + ny]];
  return area(q) < 0 ? q.reverse() : q;
}
const area = (q) => q.reduce((s, p, i) => { const n = q[(i + 1) % q.length]; return s + p[0] * n[1] - n[0] * p[1]; }, 0) / 2;
function inset(x, y, w, d, by) { return [x + by, y + by, w - 2 * by, d - 2 * by]; }

const LIGHT = [-0.62, -0.78];          // horizontal light direction (from front left)
function shadeOf(nx, ny) {
  const v = (nx * LIGHT[0] + ny * LIGHT[1] + 1) / 2;
  return Math.max(0, Math.min(3, Math.floor(v * 3.999)));
}

// convex prism on a plan polygon, from z0 up by h. Optional zTop(x, y) tilts the top.
function prism(C, plan, z0, h, o = {}) {
  const q = area(plan) < 0 ? [...plan].reverse() : plan;
  const zt = o.zTop || (() => z0 + h);
  const zb = o.zBot || (() => z0);
  const bot = q.map((p) => pr(C, [p[0], p[1], zb(p[0], p[1])]));
  const top = q.map((p) => pr(C, [p[0], p[1], zt(p[0], p[1])]));
  let faces = "", crease = [];
  for (let i = 0; i < q.length; i++) {
    const j = (i + 1) % q.length;
    const dx = q[j][0] - q[i][0], dy = q[j][1] - q[i][1], L = Math.hypot(dx, dy) || 1;
    const nx = dy / L, ny = -dx / L;
    if (-nx * C.sa + ny * C.ca >= -1e-6) continue;          // faces away
    faces += `<path class="iso-shade" data-shade="${shadeOf(nx, ny)}" d="${poly2d([bot[i], bot[j], top[j], top[i]])}"/>`;
    crease.push([top[i], top[j]]);
  }
  const outline = hull(bot.concat(top));
  const tone = o.tone || "mid";
  const cr = crease.map(([a, b]) => "M" + pt(a) + "L" + pt(b)).join("");
  const attrs = (o.lit ? ' data-lit=""' : "") + (o.attrs || "");
  return `<g class="iso-solid"${attrs}><path class="iso-fill" d="${poly2d(outline)}"/>${faces}<path class="iso-top" d="${poly2d(top)}"/>` +
    (o.inner || "") +
    `<path class="iso-line" data-tone="${o.crease || "faint"}" d="${cr}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${poly2d(outline)}"/></g>`;
}

// a straight beam through stations [{x, y, zt, zb}] (top and bottom may vary: a deflected member)
function beam(C, st, w, o = {}) {
  const a = st[0], b = st[st.length - 1], L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const ux = (b.x - a.x) / L, uy = (b.y - a.y) / L, nx = -uy, ny = ux, hw = w / 2;
  const vis = (px, py) => -px * C.sa + py * C.ca < -1e-6;
  const sp = vis(nx, ny) ? 1 : -1;                                  // the visible long side
  const P = (s, side, top) => pr(C, [s.x + side * nx * hw, s.y + side * ny * hw, top ? s.zt : s.zb]);
  const nT = st.map((s) => P(s, sp, 1)), nB = st.map((s) => P(s, sp, 0)), fT = st.map((s) => P(s, -sp, 1));
  const eVis = vis(ux, uy), bVis = vis(-ux, -uy);
  let faces = `<path class="iso-shade" data-shade="${shadeOf(sp * nx, sp * ny)}" d="${poly2d(nT.concat([...nB].reverse()))}"/>`;
  if (eVis) faces += `<path class="iso-shade" data-shade="${shadeOf(ux, uy)}" d="${poly2d([P(b, 1, 1), P(b, -1, 1), P(b, -1, 0), P(b, 1, 0)])}"/>`;
  if (bVis) faces += `<path class="iso-shade" data-shade="${shadeOf(-ux, -uy)}" d="${poly2d([P(a, 1, 1), P(a, -1, 1), P(a, -1, 0), P(a, 1, 0)])}"/>`;
  const top = poly2d(nT.concat([...fT].reverse()));
  // silhouette: near bottom, the end, far top back, the start
  const out = [...nB];
  if (eVis) out.push(P(b, -sp, 0), P(b, -sp, 1)); else out.push(P(b, sp, 1));
  out.push(...[...fT].reverse().slice(eVis ? 0 : 0));
  if (bVis) out.push(P(a, -sp, 0)); else out.push(P(a, sp, 1));
  let cr = "M" + nT.map(pt).join("L");
  if (eVis) cr += "M" + pt(P(b, sp, 0)) + "L" + pt(P(b, sp, 1)) + "L" + pt(P(b, -sp, 1));
  if (bVis) cr += "M" + pt(P(a, sp, 0)) + "L" + pt(P(a, sp, 1)) + "L" + pt(P(a, -sp, 1));
  const tone = o.tone || "mid";
  return `<g class="iso-solid"${o.lit ? ' data-lit=""' : ""}>${faces}<path class="iso-top" d="${top}"/>${o.inner || ""}` +
    `<path class="iso-line" data-tone="${o.crease || "faint"}" d="${cr}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${poly2d(out)}"/></g>`;
}

// vertical cylinder, smooth side (one gradient), flat top
function cyl(C, cx, cy, r, z0, h, o = {}) {
  const n = o.n || 40;
  const ring = circ(cx, cy, r, n);
  const bot = ring.map((p) => pr(C, [p[0], p[1], z0]));
  const top = ring.map((p) => pr(C, [p[0], p[1], z0 + h]));
  const outline = hull(bot.concat(top));
  const tone = o.tone || "mid";
  const attrs = (o.lit ? ' data-lit=""' : "") + (o.attrs || "");
  // front arc of the top rim, ordered along the rim
  const idx = ring.map((_, i) => i).filter((i) => { const a = (i / n) * TAU; return -Math.cos(a) * C.sa + Math.sin(a) * C.ca < 0; });
  const start = Math.max(0, idx.findIndex((i) => !idx.includes((i - 1 + n) % n)));
  const ordered = idx.length ? idx.slice(start).concat(idx.slice(0, start)) : [];
  const arc = ordered.length ? "M" + ordered.map((i) => pt(top[i])).join("L") : "";
  return `<g class="iso-solid iso-cyl"${attrs}><path class="iso-fill" d="${poly2d(outline)}"/><path class="iso-side" d="${poly2d(outline)}"/>` +
    `<path class="iso-top" d="${poly2d(top)}"/>${o.inner || ""}<path class="iso-line" data-tone="${o.crease || "faint"}" d="${arc}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${poly2d(outline)}"/></g>`;
}

function line(C, pts, tone = "lo", extra = "") {
  return `<path class="iso-line" data-tone="${tone}"${extra} d="M${pts.map((p) => pt(pr(C, p))).join("L")}"/>`;
}
function seg(C, a, b) { return "M" + pt(pr(C, a)) + "L" + pt(pr(C, b)); }
function ringPath(C, cx, cy, r, z, n = 24) {
  return poly2d(circ(cx, cy, r, n).map((p) => pr(C, [p[0], p[1], z])));
}
function dots(C, pts, r = 0.5, tone = "mid") {
  return `<g class="iso-dots" data-tone="${tone}">${pts.map((p) => { const q = pr(C, p); return `<circle cx="${f2(q[0])}" cy="${f2(q[1])}" r="${r}"/>`; }).join("")}</g>`;
}
// a tube along a 3-D polyline: body stroke, shine, end discs
function tube(C, pts, w = 2.4, o = {}) {
  const d = "M" + pts.map((p) => pt(pr(C, p))).join("L");
  const a = pr(C, pts[0]), b = pr(C, pts[pts.length - 1]);
  const ends = o.ends === false ? "" : `<circle class="iso-cap" cx="${f2(a[0])}" cy="${f2(a[1])}" r="${f2(w * 0.62)}"/><circle class="iso-cap" cx="${f2(b[0])}" cy="${f2(b[1])}" r="${f2(w * 0.62)}"/>`;
  return `<g class="iso-tube"${o.attrs || ""}><path class="tb-edge" d="${d}" style="stroke-width:${f2(w + 1.2)}"/><path class="tb-body" d="${d}" style="stroke-width:${f2(w)}"/>` +
    `<path class="tb-shine" d="${d}" style="stroke-width:${f2(Math.max(0.5, w * 0.28))};transform:translate(${f2(-w * 0.18)}px,${f2(-w * 0.22)}px)"/>${ends}</g>`;
}
// text engraved on a horizontal face: matrix mapping text x to world dir u, text y to world dir v
function faceText(C, origin, u, v, text, o = {}) {
  const O = pr(C, origin), U = pr(C, [origin[0] + u[0], origin[1] + u[1], origin[2] + u[2]]), V = pr(C, [origin[0] + v[0], origin[1] + v[1], origin[2] + v[2]]);
  const m = [U[0] - O[0], U[1] - O[1], V[0] - O[0], V[1] - O[1], O[0], O[1]].map(f2).join(" ");
  return `<text class="iso-face-text" data-tone="${o.tone || "lo"}" transform="matrix(${m})" font-size="${o.size || 3}" text-anchor="${o.anchor || "start"}">${text}</text>`;
}

// painter: items {at: [x,y,z], svg} sorted far to near, plus an optional bias
function paint(C, items) {
  return items.map((it) => ({ ...it, key: near(C, it.at) + (it.bias || 0) })).sort((a, b) => a.key - b.key).map((it) => it.svg).join("");
}

function halo(C, plan, z) {
  return `<path class="iso-halo" d="${poly2d(hull(plan.map((p) => pr(C, [p[0], p[1], z]))))}"/>`;
}

// ruler ticks along x on a strip top at y = edge, every `step`, major every `major`
function ticksX(C, x0, x1, step, major, y, z, len) {
  let minor = "", maj = "";
  for (let i = 0, x = x0; x <= x1 + 1e-6; i++, x = x0 + i * step) {
    const s = seg(C, [x, y, z], [x, y + (i % major === 0 ? len[1] : len[0]), z]);
    if (i % major === 0) maj += s; else minor += s;
  }
  return `<path class="iso-line" data-tone="lo" d="${minor}"/><path class="iso-line" data-tone="mid" d="${maj}"/>`;
}

// a smooth exponential follow
const follow = (v, target, dt, tau) => v + (target - v) * (1 - Math.exp(-dt / tau));

// The shared object of both figures: a bench model of the Ng = 3 deck, built
// from the real plan coordinates in data/deck.json (1 world unit = 50 mm).


const MM = 50;              // mm per world unit
const ZD = 30;              // girder top
const GD = 8;               // girder depth
const PLATE = { x: -26, y: -88, w: 412, d: 236, r: 9 };
const PLATE_H = 10, FOOT_H = 6;

const SPEC = {                     // top, depth, width per member group
  girder: [ZD, GD, 4], front: [ZD, GD, 4], cross: [ZD, 5, 2.4], balcony: [ZD, 4, 3],
  bottom: [ZD - GD, 5, 4], diagonal: [ZD - GD, 1.4, 1.6], edge: [ZD, 4, 2.4], balcony_brace: [ZD, 3, 2],
};

function deckModel(D) {
  const nodes = D.xy_mm.map(([x, y]) => [x / MM, y / MM]);
  const gy = D.girders_y_mm.map((y) => y / MM);
  const onGirder = nodes.map(([, y]) => gy.some((g) => Math.abs(g - y) < 1e-3));
  const L = Math.max(...nodes.map((n) => n[0]));
  const members = D.edges_undirected.map(([a, b], k) => ({ a, b, k, group: D.edge_group[k] }));
  const nbr = nodes.map(() => []);
  for (const [s, t] of D.edges_directed) nbr[t].push(s);
  return { nodes, gy, onGirder, L, members, nbr, supports: D.supports };
}

// the plan bar of one member, trimmed where it lands on a girder's side
function memberPlan(M, m) {
  const [w] = [SPEC[m.group][2]];
  let A = M.nodes[m.a], B = M.nodes[m.b];
  const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len;
  let ta = 0, tb = len;
  if (m.group !== "girder") {
    const outer = (i) => Math.abs(M.nodes[i][1] - M.gy[0]) < 1e-3 || Math.abs(M.nodes[i][1] - M.gy[M.gy.length - 1]) < 1e-3;
    const trimAt = (i) => (m.group === "front" ? (outer(i) ? -2 : 0) : 2);
    if (M.onGirder[m.a]) ta += Math.abs(uy) > 0.2 ? trimAt(m.a) / Math.abs(uy) : 0;
    if (M.onGirder[m.b]) tb -= Math.abs(uy) > 0.2 ? trimAt(m.b) / Math.abs(uy) : 0;
  } else if (Math.abs(B[0] - M.L) < 1e-6) tb -= 2;
  else if (Math.abs(A[0] - M.L) < 1e-6) ta += 2;
  const a = [A[0] + ux * ta, A[1] + uy * ta], b = [A[0] + ux * tb, A[1] + uy * tb];
  return { a, b, w, ta: ta / len, tb: tb / len, len };
}

// the deck, painted in rows from the far girder to the near one; dz[node] lifts each node.
// o.rails(m, zAt) returns the twin-rail lines of member m (drawn on its top face).
function deckSvg(C, M, dz, o = {}) {
  const rails = o.rails || (() => "");
  const zAt = (m, x, y) => {
    const A = M.nodes[m.a], B = M.nodes[m.b], L2 = (B[0] - A[0]) ** 2 + (B[1] - A[1]) ** 2;
    const t = Math.max(0, Math.min(1, ((x - A[0]) * (B[0] - A[0]) + (y - A[1]) * (B[1] - A[1])) / L2));
    return dz[m.a] + (dz[m.b] - dz[m.a]) * t;
  };
  const one = (m) => {
    const [top, depth, w] = SPEC[m.group], p = memberPlan(M, m);
    const st = [p.a, p.b].map(([x, y]) => ({ x, y, zt: top + zAt(m, x, y), zb: top - depth + zAt(m, x, y) }));
    return { at: [(p.a[0] + p.b[0]) / 2, (p.a[1] + p.b[1]) / 2, top], svg: beam(C, st, w, { inner: rails(m, (x, y) => top + zAt(m, x, y)) }) };
  };
  const gIdx = (i) => M.gy.findIndex((g) => Math.abs(g - M.nodes[i][1]) < 1e-3);
  const under = [], rows = M.gy.map(() => ({ girder: [], between: [] })), after = [];
  for (const m of M.members) {
    if (m.group === "diagonal" || m.group === "bottom") under.push(one(m));
    else if (m.group === "girder") rows[gIdx(m.a)].girder.push(m);
    else if (m.group === "front") after.push(one(m));
    else if (M.onGirder[m.a] && M.onGirder[m.b]) rows[Math.max(gIdx(m.a), gIdx(m.b))].between.push(one(m));
    else { const g = M.onGirder[m.a] ? gIdx(m.a) : gIdx(m.b); (g === 0 ? after : rows[g].between).push(one(m)); }
  }
  let out = paint(C, under);
  for (let g = M.gy.length - 1; g >= 0; g--) {
    const segs = rows[g].girder.sort((p, q) => M.nodes[p.a][0] + M.nodes[p.b][0] - M.nodes[q.a][0] - M.nodes[q.b][0]);
    const ids = [...new Set(segs.flatMap((m) => [m.a, m.b]))].sort((p, q) => M.nodes[p][0] - M.nodes[q][0]);
    const st = ids.map((i) => ({ x: Math.min(M.nodes[i][0], M.L - 2), y: M.nodes[i][1], zt: ZD + dz[i], zb: ZD - GD + dz[i] }));
    out += beam(C, st, 4, { inner: segs.map((m) => rails(m, (x, y) => ZD + zAt(m, x, y))).join("") });
    out += paint(C, rows[g].between);
  }
  return out + paint(C, after);
}

function nodeTop(M, i) {
  const [x, y] = M.nodes[i];
  if (M.onGirder[i]) return ZD;
  return Math.abs(x - 231.02) < 1 ? ZD - GD : ZD;     // bottom-beam ends sit lower
}

// the station puck at every node
function puckItems(C, M, dz, toneOf) {
  return M.nodes.map(([x, y], i) => {
    const t = toneOf ? toneOf(i) : { tone: "mid" };
    const z = nodeTop(M, i) + dz[i];
    return { at: [x, y, z + 1], bias: 0.5, svg: cyl(C, x, y, 1.9, z, 1.4, { tone: t.tone, lit: t.lit, n: 24 }) + (t.dot ? dots(C, [[x, y, z + 1.4]], 0.55, t.dot) : "") , i };
  });
}

// hinge bearings (x = 0) and bottom-beam bearings, base to member
function pedestalItems(C, M) {
  const items = [];
  for (const i of M.supports) {
    const [x, y] = M.nodes[i];
    const zTopOf = nodeTop(M, i) - (M.onGirder[i] ? GD : 5);
    const zPin = zTopOf - 4;
    const pad = rrect(x - 6, y - 6, 12, 12, 1.5);
    let s = prism(C, pad, 0, 2, { tone: "lo" });
    s += prism(C, rrect(x - 4.5, y - 4.5, 9, 9, 1), 2, zPin - 6, { tone: "mid" });
    s += dots(C, [[x - 4.4, y - 4.4, 2], [x + 4.4, y + 4.4, 2], [x + 4.4, y - 4.4, 2]], 0.45, "mid");
    // cheek plates and the hinge pin across them
    s += prism(C, rrect(x - 3.5, y + 2.6, 7, 1.4, 0.4), zPin - 4, zTopOf - zPin + 4, { tone: "mid" });
    s += tube(C, [[x, y - 3.4, zPin], [x, y + 3.4, zPin]], 2.6);
    s += prism(C, rrect(x - 3.5, y - 4, 7, 1.4, 0.4), zPin - 4, zTopOf - zPin + 4, { tone: "mid" });
    items.push({ at: [x, y, 6], svg: s, bias: -80 });
  }
  return items;
}

function baseSvg(C, o = {}) {
  const P = PLATE;
  const plan = rrect(P.x, P.y, P.w, P.d, P.r, 4);
  let s = halo(C, plan, -PLATE_H - FOOT_H);
  const feet = [[P.x + 22, P.y + 22], [P.x + P.w - 22, P.y + 22], [P.x + 22, P.y + P.d - 22], [P.x + P.w - 22, P.y + P.d - 22]];
  feet.sort((a, b) => (-a[0] * C.sa + a[1] * C.ca) > (-b[0] * C.sa + b[1] * C.ca) ? -1 : 1);
  for (const [x, y] of feet) {
    s += cyl(C, x, y, 9, -PLATE_H - FOOT_H, 1.8, { tone: "lo" });
    s += cyl(C, x, y, 7, -PLATE_H - FOOT_H + 1.8, FOOT_H - 1.8, { tone: "mid" });
  }
  s += prism(C, plan, -PLATE_H, PLATE_H, { tone: "mid" });
  // the bevel lip and groove on the top
  s += `<path class="iso-line" data-tone="lo" d="${poly2d(rrect(P.x + 6, P.y + 6, P.w - 12, P.d - 12, P.r - 4, 4).map((p) => pr(C, [p[0], p[1], 0])))}"/>`;
  const screws = [[P.x + 12, P.y + 12], [P.x + P.w - 12, P.y + 12], [P.x + 12, P.y + P.d - 12], [P.x + P.w - 12, P.y + P.d - 12]];
  s += screws.map(([x, y]) => `<path class="iso-line" data-tone="lo" d="${ringPath(C, x, y, 2.4, 0, 16)}"/>`).join("");
  s += dots(C, screws.map(([x, y]) => [x, y, 0]), 0.55, "mid");
  // ruler strip along the back, 0 to L in 0.25 m steps, a major tick every metre
  const L = o.L || 357;
  const ry = 124;
  s += prism(C, rrect(-6, ry, L + 12, 8, 1), 0, 0.7, { tone: "lo", crease: "faint" });
  s += ticksX(C, 0, L, 5, 4, ry + 0.9, 0.7, [2.2, 4]);
  s += dots(C, [[-3, ry + 4, 0.7], [L + 3, ry + 4, 0.7]], 0.45, "mid");
  // label plate, back left: the one engraved label
  const lp = { x: P.x + 14, y: 104, w: 34, d: 16 };
  s += prism(C, rrect(lp.x, lp.y, lp.w, lp.d, 1.2), 0, 0.9, { tone: "mid" });
  s += `<path class="iso-line" data-tone="faint" d="${poly2d(rrect(lp.x + 1.6, lp.y + 1.6, lp.w - 3.2, lp.d - 3.2, 0.6).map((p) => pr(C, [p[0], p[1], 0.9])))}"/>`;
  s += faceText(C, [lp.x + 4, lp.y + 10.5, 0.9], [1, 0, 0], [0, -1, 0], o.label || "Ng 3 · L 17.8 m", { size: 3.4, tone: "mid" });
  s += line(C, [[lp.x + 4, lp.y + 6.2, 0.9], [lp.x + 24, lp.y + 6.2, 0.9]], "lo", ' data-free=""');
  s += line(C, [[lp.x + 4, lp.y + 3.8, 0.9], [lp.x + 17, lp.y + 3.8, 0.9]], "lo", ' data-free=""');
  s += dots(C, [[lp.x + 1.9, lp.y + lp.d / 2, 0.9], [lp.x + lp.w - 1.9, lp.y + lp.d / 2, 0.9]], 0.45, "mid");
  return s;
}

// the deck plan's corners, for fitting the camera
function benchCorners(extraZ = 0) {
  const P = PLATE;
  return [[P.x, P.y, -PLATE_H - FOOT_H], [P.x + P.w, P.y, -PLATE_H - FOOT_H], [P.x, P.y + P.d, -PLATE_H - FOOT_H], [P.x + P.w, P.y + P.d, -PLATE_H - FOOT_H],
    [P.x, P.y + P.d, ZD + extraZ], [P.x + P.w, P.y + P.d, ZD + extraZ], [P.x, P.y, ZD], [P.x + P.w, P.y, ZD]];
}

  s += `<path class="trace" d="M${psd.map((v, k) => pt(onFace(SP.x0 + (k / 399) * (SP.x1 - SP.x0), SP.z0 + 0.6 + v * (SP.z1 - SP.z0 - 1.8)))).join("L")}"/>`;
  // the iteration counter, a little display on the top face of the DAQ
  s += faceText(C, [DAQ.x + DAQ.w - 30, DAQ.y + 12, DAQ.h], [1, 0, 0], [0, -1, 0], `k ${String(S.kShow).padStart(2, "0")}/50`, { size: 5, tone: "hi" });
  return s;
}

// ---------------------------------------------------------------- render
const MODEL_STATIC = baseSvg(C, { L: M.L });
function render() {
  layer("deck").innerHTML = deckLayer();
  layer("top").innerHTML = daqSvg + screens();
  setText();
}
let daqSvg = "";
const f2 = (v) => v.toFixed(2);
function setText() {
  const x = iters[S.kShow][S.sel], tt = (D.t0 + S.t / D.fs).toFixed(3);
  const who = isSensor.has(S.sel) ? `sensor node ${S.sel} ${f2(x)} mm/s² (clamped)` : `node ${S.sel} ${f2(x)} mm/s² (true ${f2(D.true_series[S.sel][S.t])})`;
  const t = `t ${tt} s · k ${S.kShow}/50 · ${who} · phase at ${S.f}`;
  if (readout.textContent !== t) readout.textContent = t;
  document.querySelectorAll("[data-f]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === S.f)));
  const r = document.querySelector("[data-time]"); if (+r.value !== S.t) r.value = S.t;
  plate.setAttribute("aria-valuetext", t);
}
function setTime(t) { S.t = Math.max(0, Math.min(D.ns - 1, t)); iters = propagate(SENS.map((_, q) => D.sensor_series[q][S.t]), 50); render(); }

// ---------------------------------------------------------------- loop
let frame = 0, last = 0, visible = false, acc = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (S.touring) {
    S.tourT += dt;
    if (S.k === 0 && S.tourT > 1.2) S.playing = true;
    if (S.k === 50 && S.tourT > 3.0) {
      S.loop++; S.tourT = 0; S.k = 0; S.kShow = 0;
      if (S.loop % 2 === 0) S.f = S.f === "B1" ? "T1" : "B1";
      S.sel = [27, 9, 40, 56, 18, 33][S.loop % 6];
      setTime((S.t + 17) % D.ns);
    }
  } else if ((S.idle += dt) > 10 && !still.matches) { S.touring = true; S.tourT = 0; }
  if (S.playing) {
    acc += dt;
    const step = S.k < 10 ? 0.22 : 0.06;              // slow for the first steps, where most of the change happens
    while (acc > step && S.k < 50) { acc -= step; S.k++; }
    if (S.k >= 50) { S.playing = false; acc = 0; if (S.touring) S.tourT = 0; }
  }
  if (S.kShow !== S.k) { S.kShow = S.k; render(); }
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

// ---------------------------------------------------------------- input
const hold = () => { S.touring = false; S.idle = 0; };
function nodeAt(evt) {
  const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  let best = -1, bd = 1e9;
  M.nodes.forEach(([x, y], i) => { const s = pr(C, [x, y, nodeTop(M, i) + 1]); const d = Math.hypot(s[0] - q.x, s[1] - q.y); if (d < bd) { bd = d; best = i; } });
  return bd < 14 ? best : -1;
}
svg.addEventListener("pointermove", (e) => { const i = nodeAt(e); if (i >= 0 && i !== S.sel) { hold(); S.sel = i; render(); } });
svg.addEventListener("click", (e) => { const i = nodeAt(e); if (i >= 0) { hold(); S.sel = i; render(); } });
const play = () => { hold(); if (S.k >= 50) { S.k = 0; S.kShow = -1; } S.playing = true; run(); };
plate.addEventListener("keydown", (e) => {
  let used = true;
  if (e.key === " ") play();
  else if (e.key === "ArrowRight") { hold(); setTime(S.t + 1); }
  else if (e.key === "ArrowLeft") { hold(); setTime(S.t - 1); }
  else if (e.key === "ArrowUp") { hold(); S.k = Math.min(50, S.k + 1); }
  else if (e.key === "ArrowDown") { hold(); S.k = Math.max(0, S.k - 1); }
  else if (e.key === "b" || e.key === "B") { hold(); S.f = "B1"; render(); }
  else if (e.key === "t" || e.key === "T") { hold(); S.f = "T1"; render(); }
  else used = false;
  if (used) e.preventDefault();
});
document.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.act === "play") play();
  if (b.dataset.act === "step") { hold(); S.playing = false; S.k = Math.min(50, S.k + 1); }
  if (b.dataset.act === "reset") { hold(); S.playing = false; S.k = 0; }
}));
document.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { hold(); S.f = b.dataset.f; render(); }));
document.querySelector("[data-time]").addEventListener("input", (e) => { hold(); setTime(+e.target.value); });
new IntersectionObserver((en) => { visible = en[en.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(plate);
if (still.matches) { S.k = 50; S.kShow = 50; }

window.__fig = { S, hold, setTime, setK: (k) => { hold(); S.playing = false; S.k = k; S.kShow = k; render(); }, setSel: (i) => { hold(); S.sel = i; render(); }, setF: (f) => { hold(); S.f = f; render(); } };

layer("base").innerHTML = MODEL_STATIC;
layer("under").innerHTML = paint(C, pedestalItems(C, M)) + cables();
daqSvg = daq();
render();
})();
</script>
</body></html>
